name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # New critical CVEs fail the PR; non-critical exceptions in docs/security-acceptance.md.
      - name: Audit dependencies (critical only)
        run: pnpm audit --audit-level=critical

  build-web:
    name: Production Build (web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Build @jewelry/shared
        run: pnpm --filter @jewelry/shared build

      # tsc catches type drift in test fixtures that next build skips.
      - name: Type-check (tsc --noEmit)
        run: pnpm --filter web exec tsc --noEmit

      - name: Build
        run: pnpm --filter web build
        env:
          SENTRY_SUPPRESS_INSTRUMENTATION_FILE_WARNING: 1

  unit-tests-web:
    name: Unit & Component Tests (web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Build @jewelry/shared
        run: pnpm --filter @jewelry/shared build

      - name: Run Vitest
        run: pnpm --filter web test:run

      - name: Upload web Allure results
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web
          path: apps/web/allure-results
          retention-days: 1
          if-no-files-found: ignore

  unit-tests-api:
    name: Unit Tests (api)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Build @jewelry/shared
        run: pnpm --filter @jewelry/shared build

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Run Jest
        run: pnpm --filter api test

      - name: Upload api Allure results
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: apps/api/allure-results
          retention-days: 1
          if-no-files-found: ignore

  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    # Only needed for PRs — push to main always runs E2E unconditionally.
    if: github.event_name == 'pull_request'
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: detect-changes
    # `always()` — otherwise skipped `needs` cascade-skips this job on push to main.
    # Runs on: any push to main, OR PRs that touched frontend code.
    if: |
      always() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || (github.event_name == 'pull_request' && needs.detect-changes.outputs.frontend == 'true')
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Build @jewelry/shared
        run: pnpm --filter @jewelry/shared build

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium webkit

      - name: Run Playwright E2E tests
        run: pnpm --filter web test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload e2e Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e
          path: apps/web/allure-results
          retention-days: 1
          if-no-files-found: ignore

  allure-publish:
    name: Publish Allure dashboard to GitHub Pages
    needs: [unit-tests-web, unit-tests-api, e2e-tests]
    # `if: always()` so the dashboard shows failed runs too — that's the point.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download web allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-web
          path: allure-results
        continue-on-error: true

      - name: Download api allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-api
          path: allure-results
        continue-on-error: true

      - name: Download e2e allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-e2e
          path: allure-results
        continue-on-error: true

      - name: Skip if no allure-results were uploaded
        id: check
        run: |
          if [ -d allure-results ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
            echo "has_results=true" >> $GITHUB_OUTPUT
          else
            echo "has_results=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch existing gh-pages history
        if: steps.check.outputs.has_results == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-existing
        continue-on-error: true

      # Allure trend graph requires prior history/ to be copied back into
      # allure-results/ before generating. Missing on first run is fine.
      - name: Restore Allure history
        if: steps.check.outputs.has_results == 'true'
        run: |
          if [ -d gh-pages-existing/history ]; then
            cp -r gh-pages-existing/history allure-results/history
          fi

      - name: Generate Allure HTML report
        if: steps.check.outputs.has_results == 'true'
        run: npx -y allure-commandline generate allure-results --clean -o allure-report

      - name: Deploy to gh-pages
        if: steps.check.outputs.has_results == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
          force_orphan: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'chore: publish Allure dashboard for ${{ github.sha }}'
