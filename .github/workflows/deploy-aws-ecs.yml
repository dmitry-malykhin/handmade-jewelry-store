# Cutover runbook: docs/runbooks/aws-ecs-deploy.md

name: Deploy API to AWS ECS

on:
  # Manual until Fly.io → ECS cutover; then switch to push: branches: [main].
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 'Skip Prisma migrate deploy step (use only when migrations were already applied separately)'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-aws-ecs
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy API → ECS Fargate
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ secrets.AWS_ECR_REPOSITORY }}:sha-${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ secrets.AWS_ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ secrets.AWS_ECS_TASK_FAMILY }}" \
            --query 'taskDefinition' \
            > task-definition.json

      - name: Render new task definition with image SHA
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ secrets.AWS_ECS_CONTAINER_NAME }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ secrets.AWS_ECR_REPOSITORY }}:sha-${{ github.sha }}

      # Migrations run in a one-off Fargate task BEFORE the rolling update.
      # If they fail, existing pods stay up on the old schema.
      - name: Apply pending Prisma migrations
        if: ${{ inputs.skip_migrations != true }}
        run: |
          aws ecs run-task \
            --cluster "${{ secrets.AWS_ECS_CLUSTER }}" \
            --task-definition "${{ secrets.AWS_ECS_TASK_FAMILY }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$(aws ec2 describe-subnets --filters 'Name=tag:Tier,Values=private' --query 'Subnets[*].SubnetId' --output text | tr '\t' ',')],securityGroups=[$(aws ec2 describe-security-groups --filters 'Name=group-name,Values=${{ secrets.AWS_ECS_CLUSTER }}-ecs-sg' --query 'SecurityGroups[0].GroupId' --output text)],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"${{ secrets.AWS_ECS_CONTAINER_NAME }}","command":["node","/app/apps/api/node_modules/.bin/prisma","migrate","deploy","--schema=/app/apps/api/prisma/schema.prisma"]}]}' \
            --query 'tasks[0].taskArn' --output text > migration-task-arn.txt

          TASK_ARN=$(cat migration-task-arn.txt)
          echo "Waiting for migration task $TASK_ARN to finish..."
          aws ecs wait tasks-stopped --cluster "${{ secrets.AWS_ECS_CLUSTER }}" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "${{ secrets.AWS_ECS_CLUSTER }}" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE — service NOT updated."
            aws logs tail "/ecs/${{ secrets.AWS_ECS_CLUSTER }}/api" --since 5m | tail -100
            exit 1
          fi
          echo "Migrations applied."

      - name: Deploy to ECS service (rolling)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ secrets.AWS_ECS_SERVICE }}
          cluster: ${{ secrets.AWS_ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      - name: Smoke test — /api/health
        run: |
          # ALB target-group health check has its own ~30s settle window after ECS reports steady-state.
          sleep 20
          curl --fail --show-error --silent --max-time 10 \
            "${{ secrets.AWS_API_HEALTH_URL }}" \
            || (echo "Health check failed after deploy" && exit 1)
