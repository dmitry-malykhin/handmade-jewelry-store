# Deploy NestJS API to AWS ECS Fargate (#82).
#
# Cutover-aware: the Fly.io workflow (deploy-flyio-production.yml) is the
# default pre-revenue. This one is `workflow_dispatch`-gated so the cutover
# is intentional — you don't accidentally start running both deploys in
# parallel and end up paying for both stacks.
#
# Required GitHub Secrets (set BEFORE first run — see Terraform output):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION                 (e.g. us-east-1)
#   AWS_ECR_REPOSITORY         (e.g. handmade-jewelry-store-api)
#   AWS_ECS_CLUSTER            (e.g. handmade-jewelry-store-cluster)
#   AWS_ECS_SERVICE            (e.g. handmade-jewelry-store-api)
#   AWS_ECS_TASK_FAMILY        (e.g. handmade-jewelry-store-api)
#   AWS_ECS_CONTAINER_NAME     (e.g. api)
#   AWS_API_HEALTH_URL         (e.g. https://api.senichka.com/api/health)
#
# Cutover runbook: docs/runbooks/aws-ecs-deploy.md

name: Deploy API to AWS ECS

on:
  # Manual trigger only until we cut over from Fly.io. After cutover, flip to
  #   push:
  #     branches: [main]
  #     paths:
  #       - 'apps/api/**'
  #       - 'packages/shared/**'
  #       - 'apps/api/Dockerfile'
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 'Skip Prisma migrate deploy step (use only when migrations were already applied separately)'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-aws-ecs
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy API → ECS Fargate
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Standard AWS SDK auth via static access keys. We can swap this for
      # OIDC federation later (post-MVP improvement noted in infra/aws/README).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The image tag is the commit SHA so every deploy is identifiable in
      # ECR + ECS console + CloudWatch logs. We also tag :latest for casual
      # `docker pull` from the runbook — the SHA tag is what ECS uses.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ secrets.AWS_ECR_REPOSITORY }}:sha-${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ secrets.AWS_ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Pull the current task definition, swap the image, register a new
      # revision, and update the service. amazon-ecs-render-task-definition
      # is the official AWS action — it preserves everything else (env vars,
      # secrets, healthCheck, etc.) so we don't have to maintain a duplicate
      # task def JSON in this repo.
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ secrets.AWS_ECS_TASK_FAMILY }}" \
            --query 'taskDefinition' \
            > task-definition.json

      - name: Render new task definition with image SHA
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ secrets.AWS_ECS_CONTAINER_NAME }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ secrets.AWS_ECR_REPOSITORY }}:sha-${{ github.sha }}

      # Prisma migrations run in a one-off Fargate task BEFORE rolling the
      # service forward. This keeps schema changes deterministic: if the
      # migration fails, the existing pods stay up on the old schema.
      - name: Apply pending Prisma migrations
        if: ${{ inputs.skip_migrations != true }}
        run: |
          # Reuse the rendered task definition but override the command to
          # run the migration instead of starting the API. We run it in a
          # one-off task and wait for it to finish.
          aws ecs run-task \
            --cluster "${{ secrets.AWS_ECS_CLUSTER }}" \
            --task-definition "${{ secrets.AWS_ECS_TASK_FAMILY }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$(aws ec2 describe-subnets --filters 'Name=tag:Tier,Values=private' --query 'Subnets[*].SubnetId' --output text | tr '\t' ',')],securityGroups=[$(aws ec2 describe-security-groups --filters 'Name=group-name,Values=${{ secrets.AWS_ECS_CLUSTER }}-ecs-sg' --query 'SecurityGroups[0].GroupId' --output text)],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"${{ secrets.AWS_ECS_CONTAINER_NAME }}","command":["node","/app/apps/api/node_modules/.bin/prisma","migrate","deploy","--schema=/app/apps/api/prisma/schema.prisma"]}]}' \
            --query 'tasks[0].taskArn' --output text > migration-task-arn.txt

          TASK_ARN=$(cat migration-task-arn.txt)
          echo "Waiting for migration task $TASK_ARN to finish..."
          aws ecs wait tasks-stopped --cluster "${{ secrets.AWS_ECS_CLUSTER }}" --tasks "$TASK_ARN"

          # Surface the exit code of the migration container.
          EXIT_CODE=$(aws ecs describe-tasks --cluster "${{ secrets.AWS_ECS_CLUSTER }}" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE — service NOT updated."
            aws logs tail "/ecs/${{ secrets.AWS_ECS_CLUSTER }}/api" --since 5m | tail -100
            exit 1
          fi
          echo "Migrations applied."

      - name: Deploy to ECS service (rolling)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ secrets.AWS_ECS_SERVICE }}
          cluster: ${{ secrets.AWS_ECS_CLUSTER }}
          # `wait-for-service-stability: true` blocks until ECS reports the
          # new task healthy AND drained the old one. This is what gives us
          # zero-downtime semantics in the workflow's own pass/fail.
          wait-for-service-stability: true
          wait-for-minutes: 15

      - name: Smoke test — /api/health
        run: |
          # Give the ALB a beat to register the fresh task. wait-for-service-stability
          # ends when ECS says steady-state, but the ALB target-group health check
          # has its own ~30s settle window.
          sleep 20
          curl --fail --show-error --silent --max-time 10 \
            "${{ secrets.AWS_API_HEALTH_URL }}" \
            || (echo "Health check failed after deploy" && exit 1)
