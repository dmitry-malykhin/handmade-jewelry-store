# Auto-deploy NestJS API to Fly.io staging on merge to main.
# Requires FLY_API_TOKEN secret in GitHub repo settings.
# Docs: docs/17_STAGING_ENVIRONMENTS.md
#
# Gate: job is skipped until the operator sets repo variable
#   FLY_DEPLOY_ENABLED=true
# (Settings → Secrets and variables → Actions → Variables). Until then we
# don't have a Fly.io app or FLY_API_TOKEN, and running flyctl would fail
# every merge for no reason.

name: Deploy API to staging

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'

jobs:
  deploy-api-staging:
    name: Deploy API → Fly.io staging
    if: vars.FLY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to staging
        run: fly deploy --config apps/api/fly.toml --dockerfile apps/api/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
